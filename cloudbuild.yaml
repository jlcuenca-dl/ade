# cloudbuild.yaml — CI/CD Pipeline para ADE
# Proyecto: Atlas de Datos Estadísticos
# Disparadores:
#   - develop  → DESA
#   - release/ → QA  
#   - main     → PROD

steps:
  # ═══════════════════════════════════════════════
  # 1. Build imagen Docker
  # ═══════════════════════════════════════════════
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ade-repo/ade-backend:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ade-repo/ade-backend:${_ENV}'
      - '.'
    id: 'build-image'

  # ═══════════════════════════════════════════════
  # 2. Push imagen a Artifact Registry
  # ═══════════════════════════════════════════════
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/ade-repo/ade-backend']
    id: 'push-image'
    waitFor: ['build-image']

  # ═══════════════════════════════════════════════
  # 3. Deploy a Cloud Run
  # ═══════════════════════════════════════════════
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ade-backend-${_ENV}'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/ade-repo/ade-backend:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--set-env-vars=ENV=${_ENV}'
    id: 'deploy-backend'
    waitFor: ['push-image']

# Variables sustituibles (se configuran por trigger)
substitutions:
  _ENV: 'desa'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '3'
  _MEMORY: '512Mi'
  _CPU: '1'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/ade-repo/ade-backend:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/ade-repo/ade-backend:${_ENV}'

timeout: '900s'
options:
  logging: CLOUD_LOGGING_ONLY
